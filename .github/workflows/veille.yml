name: veille

# Tâche « veille » : collecte cours, graphes et actualités finance / crypto (actifs.csv),
# génère le site et le publie sur la branche gh-pages (un seul commit, remplacé à chaque fois).
# La publication horaire tourne sur le lab (voir README) ; ce workflow sert de secours quotidien
# et de vérification des PR.
on:
  schedule:
    # GitHub retarde (parfois de plusieurs heures) les tâches prévues pile à l'heure :
    # on vise des minutes moins chargées, avec un passage de secours.
    - cron: "17 4 * * *"
    - cron: "47 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - actifs.csv
      - scripts/**
      - .github/workflows/veille.yml
  pull_request:                 # sur une PR : génération à blanc, sans publication
    paths:
      - actifs.csv
      - scripts/**
      - .github/workflows/veille.yml

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer et publier sur gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bash scripts/publish.sh

      - name: Générer à blanc (hors main)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: python scripts/veille.py

      - name: Aperçu (hors main)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: apercu-index
          path: _site/
