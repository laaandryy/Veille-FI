name: veille

# Tâche planifiée « veille » : collecte quotidienne des cours, graphes et actualités finance / crypto
# (actifs.csv), puis régénère index.html et le pousse sur main.
on:
  schedule:
    # GitHub retarde (parfois de plusieurs heures) ou saute les tâches prévues pile à l'heure,
    # les plus demandées. On vise donc des minutes moins chargées, avec un passage de secours.
    - cron: "17 4 * * *"       # tous les jours vers 04:17 UTC (5 h/6 h à Paris)
    - cron: "47 6 * * *"       # passage de secours vers 06:47 UTC
  workflow_dispatch: {}         # lancement manuel depuis l'onglet Actions
  push:
    branches: [main]
    paths:                      # régénère aussitôt quand la liste ou le script change
      - actifs.csv
      - scripts/**
      - .github/workflows/veille.yml
  pull_request:                 # sur une PR : génération à blanc, sans commit
    paths:
      - actifs.csv
      - scripts/**
      - .github/workflows/veille.yml

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter la veille et générer index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/veille.py

      - name: Aperçu (hors main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: apercu-index
          path: |
            index.html
            data/veille.json

      - name: Pousser sur main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "veille-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/veille.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "veille: mise à jour du $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done
